name: ci

# 每次推送到 main / PR 都跑：后端单测 + 宿主契约校验。
# 宿主的 apps/api 尚未发布为 Go module，所以这里检出 SForum 源码并覆盖 go.mod 的 replace。
# 仓库根就是「外部扩展源根」，扩展包位于 plugins/sforum.related-topics。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SFORUM_REPOSITORY: keeptrue/SForum
  # 本插件用到的宿主面（hooks / jobs / schedules / routes / own_schema + core_views /
  # 公开 L2 组件 / forum.page.regions l2Widget）都已合入宿主 main。
  SFORUM_REF: main
  PACKAGE_DIR: plugins/sforum.related-topics

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout SForum framework
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SFORUM_REPOSITORY }}
          ref: ${{ env.SFORUM_REF }}
          path: sforum

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 以宿主 go.mod 为准：插件是 replace 进宿主模块构建的。
          go-version-file: sforum/apps/api/go.mod
          cache-dependency-path: |
            sforum/apps/api/go.sum
            plugin/${{ env.PACKAGE_DIR }}/backend/go.sum

      - name: Point replace at this checkout
        working-directory: plugin/${{ env.PACKAGE_DIR }}/backend
        run: |
          set -euo pipefail
          # 必须用绝对路径：checkout 出来的 plugin 与 sforum 是两个同级目录，
          # 相对路径要往上四层才回到 $GITHUB_WORKSPACE，写错会在 CI 里静默指向不存在的目录。
          test -f "$GITHUB_WORKSPACE/sforum/apps/api/go.mod" || {
            echo "::error title=宿主检出缺失::找不到 $GITHUB_WORKSPACE/sforum/apps/api/go.mod"
            exit 1
          }
          go mod edit -replace "github.com/keeptrue/sforum/apps/api=$GITHUB_WORKSPACE/sforum/apps/api"

      - name: Backend vet and unit tests
        working-directory: plugin/${{ env.PACKAGE_DIR }}/backend
        run: |
          go vet ./...
          go test ./...

      - name: Build backend binary
        working-directory: plugin/${{ env.PACKAGE_DIR }}/backend
        run: |
          # 与宿主 dev watcher（ExtensionPackage.BuildBackend）同参：
          # CGO_ENABLED=0 + -trimpath + -buildvcs=false，否则同一份源码产出的摘要不收敛。
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o plugin ./

      - name: Refresh digests
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension digest --write "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      - name: Report stale committed digests (non-blocking)
        working-directory: plugin
        run: |
          set -euo pipefail
          # 只比摘要，不比字节：digest --write 会用 Go 的 encoding/json 重排清单
          # （例如把 ">=" 写成 "\u003e="），直接 git diff 会把纯格式差异误报成摘要漂移。
          python3 - "$PACKAGE_DIR/sforum.extension.json" <<'PY'
          import json, subprocess, sys

          path = sys.argv[1]
          old = json.loads(subprocess.check_output(["git", "show", f"HEAD:{path}"], text=True))
          new = json.load(open(path))

          def digests(m):
              out = {"backend": (m.get("backend") or {}).get("digest")}
              for f in m.get("packageFiles") or []:
                  out[f["id"]] = f.get("digest")
              for o in m.get("openapi") or []:
                  out[o["id"]] = o.get("digest")
              return out

          a, b = digests(old), digests(new)
          drift = sorted(k for k in set(a) | set(b) if a.get(k) != b.get(k))
          if drift:
              print("::notice title=包摘要有变化::本机构建的可执行文件摘要与仓库中的不一致（工具链差异常见）。发布流水线会按平台重新写入摘要，无需手工提交。")
              for k in drift:
                  print(f"  {k}: {str(a.get(k))[:16]} -> {str(b.get(k))[:16]}")
          else:
              print("digests match committed manifest")
          PY

      - name: Validate manifest
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension validate "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"

      - name: Host contract test
        working-directory: sforum/apps/api
        run: go run ./cmd/sforum extension test "$GITHUB_WORKSPACE/plugin/$PACKAGE_DIR"
